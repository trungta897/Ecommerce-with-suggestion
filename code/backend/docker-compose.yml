version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: datn_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: datn_redis
    restart: always
    ports:
      - '6379:6379'
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
