version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: datn_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datn_ecommerce
      MYSQL_USER: datn_user
      MYSQL_PASSWORD: datn_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: datn_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
